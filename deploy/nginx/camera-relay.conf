# Project L.E.A.F. Camera Relay — Nginx site config snippet
#
# Add these location blocks to the HTTPS server{} block for
# projectleaf.tech (merge with your existing config). They proxy the
# camera relay (WebSocket from ESP32 + MJPEG/PCM to browsers).
#
# The relay listens on 127.0.0.1:8300 (localhost only), so it must be
# reached through nginx. Nothing here ever connects to a camera's private
# LAN IP — the ESP32 establishes the outbound connection to the relay.

# ── WebSocket endpoint for ESP32 cameras (outbound WSS) ──────────────
location /camera/relay {
    proxy_pass http://127.0.0.1:8300/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_cache off;
    tcp_nodelay on;
}

# ── MJPEG stream for browsers (multipart/x-mixed-replace) ────────────
location /camera/stream {
    proxy_pass http://127.0.0.1:8300/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    tcp_nodelay on;
}

# ── Raw PCM audio stream for browsers ────────────────────────────────
location /camera/audio {
    proxy_pass http://127.0.0.1:8300/audio;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    tcp_nodelay on;
}
