; Local development overrides — gitignored, never commit real credentials.
; Copy this file to platformio_override.ini and fill in your values,
; or export the LEAF_* environment variables before building.
;
;   cp platformio_override.example.ini platformio_override.ini
;
[env:esp32s3-cam-n16r8]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLOG_LOCAL_LEVEL=1
    -DWIFI_SSID='"your-wifi-ssid"'
    -DWIFI_PASSWORD='"your-wifi-password"'
    -DCAMERA_DEVICE_ID='"esp32-cam-001"'
    -DCAMERA_DEVICE_NAME='"Greenhouse 1 Camera"'
    ; Backend live view integration (token from `php artisan leaf:provision-camera`)
    -DLEAF_BACKEND_URL='"http://192.168.1.10:8000"'
    -DLEAF_CAMERA_DEVICE_TOKEN='"leaf_your_device_token_here"'
    ; Cloud relay VPS host for outbound WebSocket live view
    -DRELAY_HOST='"projectleaf.tech"'
    -DFIRMWARE_VERSION='"0.1.0"'
