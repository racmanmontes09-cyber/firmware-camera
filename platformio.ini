; Project L.E.A.F. Camera Firmware
; Independent firmware for ESP32-S3-CAM N16R8 (camera + INMP441 mic).
; This is a SEPARATE project from the main proleaf sensor/automation firmware.

[platformio]
extra_configs = platformio_override.ini

[env:esp32s3-cam-n16r8]
platform = espressif32
board = esp32-s3-cam-n16r8          ; custom board definition in ./board/
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0

build_type = release

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLOG_LOCAL_LEVEL=1
    ; Credentials are injected at build time (never hard-coded in source).
    ; Set env vars before building, or copy platformio_override.example.ini.
    -DWIFI_SSID='"${sysenv.LEAF_WIFI_SSID}"'
    -DWIFI_PASSWORD='"${sysenv.LEAF_WIFI_PASSWORD}"'
    -DCAMERA_DEVICE_ID='"${sysenv.LEAF_CAMERA_DEVICE_ID}"'
    -DCAMERA_DEVICE_NAME='"${sysenv.LEAF_CAMERA_DEVICE_NAME}"'
    ; Backend integration: set these so the camera registers with Laravel
    ; and live view can resolve its LAN address. Empty = heartbeat disabled.
    -DLEAF_BACKEND_URL='"${sysenv.LEAF_BACKEND_URL}"'
    -DLEAF_CAMERA_DEVICE_TOKEN='"${sysenv.LEAF_CAMERA_DEVICE_TOKEN}"'
    ; Cloud relay: set to the VPS host the camera opens an outbound
    ; WebSocket to for remote live view (e.g. projectleaf.tech).
    -DRELAY_HOST='"${sysenv.LEAF_RELAY_HOST}"'
    -DFIRMWARE_VERSION='"0.2.0"'


upload_protocol = esptool
upload_speed = 921600
upload_flags =
    --before=default_reset
    --after=hard_reset

monitor_filters = esp32_exception_decoder

lib_deps =
